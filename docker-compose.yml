# Développement local — Mdiscover Impex Food
# Usage (depuis la racine): docker compose up -d postgres redis

services:
  postgres:
    image: postgres:16-alpine
    container_name: mdiscover-postgres
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mdiscover}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mdiscover_secret}
      POSTGRES_DB: ${POSTGRES_DB:-mdiscover}
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mdiscover} -d ${POSTGRES_DB:-mdiscover}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mdiscover-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mdiscover-app
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mdiscover}:${POSTGRES_PASSWORD:-mdiscover_secret}@postgres:5432/${POSTGRES_DB:-mdiscover}?schema=public
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles:
      - full

volumes:
  postgres_data:
  redis_data:
  uploads_data:
